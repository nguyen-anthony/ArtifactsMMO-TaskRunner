# Tests on every push/PR; deploys to the VPS on pushes to main once tests pass.
#
# Deploy secrets (repo Settings → Secrets and variables → Actions):
#   VPS_HOST     – VPS IP or hostname
#   VPS_USER     – SSH user (e.g. deploy)
#   VPS_SSH_KEY  – private key whose public half is in the user's ~/.ssh/authorized_keys
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      # Docker is available on ubuntu runners, so Testcontainers runs the Postgres tests.
      - run: ./gradlew build --no-configuration-cache

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, web]
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - name: Pull and rebuild on the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/ArtifactsMMO-TaskRunner
            git fetch --quiet origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
